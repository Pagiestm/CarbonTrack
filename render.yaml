services:
  - name: carbontrack-api
    type: web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci -w @carbontrack/api && npm run build -w @carbontrack/api
    startCommand: npm run start:prod -w @carbontrack/api
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://carbontrack.theotimepagies.com

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://carbontrack-api-3s89.onrender.com/auth/google/callback

      - key: EMAIL_USER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - name: carbontrack
    type: web
    runtime: static
    buildCommand: npm ci -w @carbontrack/web && npm run build -w @carbontrack/web
    staticPublishPath: ./apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - package-lock.json
    domains:
      - carbontrack.theotimepagies.com
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://carbontrack-api-3s89.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
