# Serveur de l'image de production du client (apps/web/Dockerfile).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La barre finale de proxy_pass retire le préfixe : /api/projects -> /projects.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Noms hachés par Vite : le contenu ne change jamais.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application à page unique. index.html n'est pas mis en cache, sinon un
    # déploiement resterait invisible.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
